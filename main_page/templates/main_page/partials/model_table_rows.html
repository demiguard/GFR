{% load gfr_tags %}
<thead>
  <tr>
    {% for field in fields %}
      <th>{{ field|capfirst }}</th>
    {% endfor %}
    <th>Handling</th>
  </tr>
</thead>
<tbody>
  {% for obj in objects %}
    <tr>
      {% for field in fields %}
        <td>
          {{ obj|attr:field }}
        </td>
      {% endfor %}
      <td>
        {% if model_name != 'procedure_mapping' %}
          <a
            href="{% url 'main_page:admin_panel_edit' model_name=model_name obj_id=obj.pk %}"
            class="btn btn-link"
            title="Rediger"
          >
            <span class="oi oi-pencil"></span>
          </a>
        {% endif %}
        <div class="divider"></div>
        <button class="btn btn-link delete-btn" data-id="{{ obj.pk }}">
          <span title="Slet" class="oi oi-trash"></span>
        </button>
      </td>
    </tr>
  {% endfor %}
</tbody>
