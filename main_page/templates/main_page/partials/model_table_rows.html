{% load gfr_tags %}
<thead>
  <tr>
    {% for field in fields %}
      <th>{{ field|capfirst }}</th>
    {% endfor %}
    <th>Handling</th>
  </tr>
</thead>
<tbody>
  {% for obj in objects %}
    <tr>
      {% for field in fields %}
        <td>
          {{ obj|attr:field }}
        </td>
      {% endfor %}
      <td>
        {% if model_name != 'procedure_mapping' %}
          <a
            href="{% url 'main_page:admin_panel_edit' model_name=model_name obj_id=obj.pk %}"
            class="btn btn-link"
            title="Rediger"
          >
            <span class="oi oi-pencil"></span>
          </a>
        {% endif %}
        <div class="divider"></div>
        <form 
          method="POST"
          hx-post="{% url 'main_page:generic_delete' model_name=model_name obj_id=obj.pk %}"
          hx-target="closest tr"
          hx-swap="outerHTML"
          onsubmit="return confirm('Er du sikker på du ønsker at slette?');"
          hx-on::after-request="htmx.ajax('GET', '/admin_panel/load_model_items/?model={{ model_name }}', {target: '#admin-table-body', swap: 'outerHTML'})"
        >
          {% csrf_token %}
          <button class="btn btn-link">
            <span title="Slet" class="oi oi-trash"></span>
          </button>
        </form>
      </td>
    </tr>
  {% endfor %}
</tbody>
