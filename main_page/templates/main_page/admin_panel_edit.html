{% extends 'main_page/base.html' %}
{% load static %}

{% block content %}
  <h2>Admin panel - edit {{ model_name }}</h2>

  <div class="row">
    <div class="col-md-3">
      <form 
        method="POST"
        hx-post="{% url 'main_page:admin_panel_edit' model_name=model_name obj_id=obj_id %}" 
        hx-target="#error-msg-container"
        hx-swap="innerHTML"
        hx-on="htmx:afterRequest: alert('Ændringer Gemt')"
      >
        {% csrf_token %}
        {{ edit_form.as_p }}

        <button type="submit" class="btn btn-primary">Gem</button>
      </form>

      <br>

      <div id="error-msg-container"></div>
    </div>
  </div>
{% endblock %}

{% block javascript %}
  <script src="{% static 'main_page/js/util/csrf.js' %}"></script>
  <script src="{% static 'main_page/js/util/alerter.js' %}"></script>
{% endblock %}
